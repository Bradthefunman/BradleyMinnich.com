name: Site checks

on:
  push:
    branches: ["main", "site/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run site checks
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/site-data.js
          node --check functions/api/contact.js